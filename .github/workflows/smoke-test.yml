name: smoke-test
on:
  push:
    paths:
      - "*.py"
      - "smoke_test.py"
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime deps
        run: |
          pip install --quiet --upgrade pip
          # tools are stdlib-only; sqlparse/sqlglot optional for strong-gate detector
          pip install --quiet sqlparse sqlglot 2>/dev/null || echo "optional deps skipped"
      - name: Run smoke test
        run: python3 smoke_test.py